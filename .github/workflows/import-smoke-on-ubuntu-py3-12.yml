name: import-smoke

# Org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers preserved verbatim from the prior local file. Job body (plain
# `pip install -e .` + import) replaced by the org-level reusable workflow,
# which does the same check via `uv`.
#
# Catches "wheel installs but `import crossref_local` blows up at runtime"
# — separate from the full pytest suite so a broken entry-point fails
# fast without paying for the matrix.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit
