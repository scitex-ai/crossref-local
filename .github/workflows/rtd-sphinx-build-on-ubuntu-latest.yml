name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    # Skip when HEAD is the bot's own previous docs auto-commit — breaks
    # the infinite loop without using `[skip ci]`, which would also
    # suppress the tag-push and release workflows when the auto-commit
    # is the most recent commit on develop at release time.
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    # PS-169: hosted runners are forbidden (operator mandate 2026-07-14) —
    # use the self-hosted pool, overridable via the CI_RUNS_ON repo variable.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create per-job venv (self-hosted shared-cache isolation)
        # Self-hosted runners share one read-only tool-cache + home, so
        # pip-installing into the base interpreter is blocked (PEP 668) and
        # would race across repos. A per-job venv on the runner's local
        # $RUNNER_TEMP isolates deps; GITHUB_PATH makes later steps use it.
        # (Same pattern as scitex-dev's rtd-sphinx workflow.)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Build Sphinx HTML (warnings fail PRs only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html
          else
            sphinx-build -b html docs/sphinx docs/sphinx/_build/html
          fi

      - name: Refresh src/crossref_local/_sphinx_html/ (develop push only)
        # main is PR-only — its _sphinx_html/ bundle arrives via the
        # develop -> main PR. Direct bot-pushes to main are inhibited
        # so the branch history stays linear-via-PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          rm -rf src/crossref_local/_sphinx_html
          cp -rf docs/sphinx/_build/html src/crossref_local/_sphinx_html
          touch src/crossref_local/_sphinx_html/.nojekyll

      - name: Commit refreshed HTML if it changed (develop push only)
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          if [ -n "$(git status --porcelain src/crossref_local/_sphinx_html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/crossref_local/_sphinx_html
            git commit -m "docs(sphinx_html): refresh from CI build"
            git push
          fi
