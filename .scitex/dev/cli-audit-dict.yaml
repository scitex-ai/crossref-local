# Project-local CLI-audit dictionary (scitex-dev audit-cli §1 leaf-naming).
#
# Moby tags `relay` as BOTH a noun and a verb, so the auditor's
# noun-vs-verb leaf check flags the `relay` subcommand as a bare noun.
# In this CLI it is the intransitive verb sense — `crossref-local relay`
# means "relay (the database over HTTP)", the same shape as `serve`.
# Declaring it here is the sanctioned escape hatch the auditor points to
# (the same mechanism `next` uses) — no rename of a published command.

intransitive_verbs:
  - relay

# §1f verb-synonym exemptions — GRANDFATHERED published commands, not
# endorsements. Both renames (check-citations -> validate-citations,
# show-status -> status) are tracked as debt in card
# crossref-local-develop-ci-red-audit; drop the entry when the rename
# lands with a Phase-W deprecated alias.
verb_exceptions:
  - check-citations  # why: published surface since 0.4.x (docs/skills/MCP parity reference it); rename to validate-citations tracked in card crossref-local-develop-ci-red-audit
  - show-status  # why: published surface with a `status` alias already; rename to a `status` leaf tracked in card crossref-local-develop-ci-red-audit
