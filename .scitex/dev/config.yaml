# scitex-dev project-type config

project-type:
  - pip

audit:
  root-whitelist:
    dirs:
      # vendor/ holds two pre-pip-install vendored upstream projects: the
      # bulk loader for the retired file-backed corpus, and a CrossRef
      # Public Data File API client. Both were build-time references for
      # the retired pipeline; nothing outside vendor/ imports either, and
      # the ingest engine (crossref_local._core.ingest) deliberately does
      # not. This entry is therefore dead weight and should be deleted in
      # the same change that deletes vendor/ — not before, because the
      # auditor walks the filesystem and would flag the directory the
      # moment this line goes.
      - vendor
      # CI-side install artefacts that `pip install -e ".[all]"`
      # creates on the GitHub Actions runner and not in the wheel.
      # They are .gitignored but the auditor walks the filesystem.
      - lib
      - lib64
    files:
      - codecov.yml
