# Docker Compose for CrossRef Local MCP Server
#
# Usage:
#   cd scripts/deployment/mcp
#   docker-compose -f docker-compose.mcp.yml up -d
#
# Configuration:
#   None required. The corpus is a store the server connects to, not a file,
#   so there is no volume to mount. To point the server at a store other than
#   this host's, export SCITEX_STORE_DSN before `up` and it is forwarded
#   below. Never write a DSN into this file — it can carry a password and
#   this file is committed.

services:
  crossref-mcp:
    build:
      context: ../../..
      dockerfile: scripts/deployment/mcp/Dockerfile.mcp
    image: crossref-mcp:latest
    container_name: crossref-mcp
    ports:
      - "8082:8082"
    environment:
      # Forwarded from the invoking shell; unset means "this host's store".
      - SCITEX_STORE_DSN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

